model_list:
  - model_name: tripmate-primary
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  - model_name: tripmate-fallback
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY

router_settings:
  num_retries: 2
  fallbacks:
    - tripmate-primary:
        - tripmate-fallback

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY